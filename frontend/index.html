<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Application</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
        }

        header {
            background: #232f3e;
            color: white;
            padding: 25px;
        }

        .container {
            margin: 60px auto;
            max-width: 700px;
            background: white;
            padding: 40px;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 15px;
        }

        .status {
            margin-top: 25px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 6px;
        }

        footer {
            margin-top: 50px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>Cloud Application</h1>
        <p>AWS DevOps Three-Tier Project</p>
    </header>

    <div class="container">
        <h2>Welcome to Our Application</h2>

        <p>
            This application is deployed using modern
            DevOps practices and cloud technologies.
        </p>

        <div class="status">
            <strong>Application Status:</strong> Running
        </div>

        <p>
            Frontend | Backend | Database
        </p>
    </div>

    <footer>
        <p>AWS DevOps Project</p>
    </footer>

</body>
</html>
