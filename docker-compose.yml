version: "3.8"

services:

  frontend:
    image: nginx:latest
    container_name: devops-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: devops-backend
    ports:
      - "5000:5000"
    depends_on:
      - database

  database:
    image: mysql:8.0
    container_name: devops-database
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: devopsdb
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
